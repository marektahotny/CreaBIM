[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.7.5"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Regis Benoit Brice Nde Tene"]
repository = "https://github.com/chopinregis/CreaBIM"
rust-version = "1.85"

[workspace.dependencies]
creabim-core = { path = "crates/creabim-core" }
creabim-geom = { path = "crates/creabim-geom" }
creabim-ifc = { path = "crates/creabim-ifc" }
creabim-store = { path = "crates/creabim-store" }
creabim-blend = { path = "crates/creabim-blend" }
creabim-exchange = { path = "crates/creabim-exchange" }
creabim-freecad = { path = "crates/creabim-freecad" }
creabim-spec = { path = "crates/creabim-spec" }
creabim-services = { path = "crates/creabim-services" }
rusqlite = { version = "0.40", features = ["bundled"] }
encoding_rs = "0.8"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"

# Shipping builds: small and fast. Measured on 2026-11-05: 38.5 MB -> 26.0 MB.
# Panics unwind: a drawing that fails on a worker is logged and left
# out instead of closing the app, and a crash on the window's thread
# still writes the work to the autosave on its way out (app autosave.rs).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Day-to-day testing at near release speed, without the long link:
# cargo build --profile fast -p creabim-app
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"
panic = "unwind"
