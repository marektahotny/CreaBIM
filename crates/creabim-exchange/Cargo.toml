[package]
name = "creabim-exchange"
description = "Linking CreaBIM to other tools' files: Blender (and later FreeCAD and IFC) objects mirrored as elements, reloaded in place, turned into walls, slabs, doors and windows; glTF export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# creabim-freecad needs 1.88.
rust-version = "1.88"

[dependencies]
creabim-core.workspace = true
creabim-geom.workspace = true
creabim-blend.workspace = true
creabim-freecad.workspace = true
encoding_rs.workspace = true
glam.workspace = true
lopdf.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
